name: CI

# Real, runnable CI for the parts of this repo that don't require live
# Azure credentials in the runner. Two stages actually execute:
#
#   1. test              — pure-Python scenario tests (workflow/approval
#                           state machine, resilience/circuit-breaker).
#                           No Azure calls; deterministic; safe to run on
#                           every push.
#   2. evaluation-gate    — enforces the syllabus's release thresholds
#                           against day3/eval_results.json, which was
#                           generated by actually running lab2_evaluation.py
#                           against live Azure resources in a prior session
#                           (see day3/SETUP_LOG.md for that debugging story)
#                           and is committed to the repo as a real,
#                           point-in-time evaluation artifact.
#
# What this does NOT do: run lab2_evaluation.py itself in CI, or anything
# else that calls Azure OpenAI / Azure AI Search / Foundry. That needs
# Azure credentials issued to the GitHub Actions runner, which means
# creating an Azure AD app registration + federated (OIDC) credential +
# RBAC role assignments — a meaningfully bigger and more sensitive step
# than wiring up a pipeline, so it was deliberately left out rather than
# set up without being asked. See README.md's "Extending this pipeline"
# section for exactly what that would involve.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    name: Deterministic scenario tests (no Azure required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install day2 dependencies
        run: pip install python-dotenv
      - name: Run workflow + approval scenario tests
        working-directory: day2
        run: python3 lab9_approval_workflow.py
      - name: Install day3 dependencies (resilience only)
        run: pip install tenacity
      - name: Run resilience scenario tests
        working-directory: day3
        run: python3 lab3_resilience.py

  evaluation-gate:
    name: Enforce evaluation release thresholds
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check release gate against committed eval_results.json
        working-directory: day3
        run: python3 check_release_gate.py
